---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo-https
  namespace: demo
spec:
  parentRefs:
    - name: gwin-gateway
      namespace: gwin-system
      sectionName: https
  # DNS зона подставляется из переменной окружения TF_VAR_dns_zone через sed
  hostnames:
    - podinfo.yc-k8s-advanced.hilbertteam.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: podinfo-v2
          namespace: demo
          port: 9898
          weight: 100

