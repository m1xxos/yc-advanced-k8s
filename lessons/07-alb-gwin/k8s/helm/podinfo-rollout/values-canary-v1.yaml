# Конфигурация для чарта podinfo-rollout с Canary strategy, Стабильная версия
# Имя rollout и service без префикса release name
# fullnameOverride: podinfo

# Namespace задается через параметр --namespace при helm install/upgrade
# namespaceOverride не используется

# Количество реплик
replicaCount: 2

# Уровень логирования
logLevel: debug

# Настройки UI
ui:
  color: "#34577c"
  message: "Lesson 7: ALB Gwin with Rollout v1"

# Отключить fault injection для стабильного тестирования
faults:
  delay: false
  error: false
  unhealthy: false
  unready: false
  testFail: false
  testTimeout: false

# Лимиты и запросы ресурсов
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

# Конфигурация Service
# Для Rollout сервисы создаются Helm чартом (values-canary-v1.yaml и values-canary-v2.yaml)
service:
  type: NodePort

# Конфигурация Argo Rollouts с Canary strategy
rollout:
  strategy:
    canary:
      # Шаги развертывания canary
      steps:
        # Шаг 1: Установить вес canary на 20%
        - setWeight: 20
        # Шаг 2: Пауза для проверки (автоматическое продвижение через 30 секунд)
        - pause:
            duration: 30
        # Шаг 3: Увеличить вес canary до 40%
        - setWeight: 40
        # Шаг 4: Пауза на 10 секунд
        - pause:
            duration: 10
        # Шаг 5: Увеличить вес canary до 60%
        - setWeight: 60
        # Шаг 6: Пауза на 10 секунд
        - pause:
            duration: 10
        # Шаг 7: Увеличить вес canary до 80%
        - setWeight: 80
        # Шаг 8: Пауза на 10 секунд
        - pause:
            duration: 10
        # Шаг 9: Продвинуть canary на 100% (автоматически)
        - setWeight: 100
      # Имя сервиса для canary версии
      # Argo Rollouts автоматически управляет селектором этого сервиса
      canaryService: podinfo-canary
      # Имя сервиса для stable версии
      # Argo Rollouts автоматически управляет селектором этого сервиса
      stableService: podinfo-stable
      # Максимальное количество недоступных подов во время обновления
      maxUnavailable: 1
      # Максимальное количество дополнительных подов во время обновления
      maxSurge: 1

# Конфигурация HTTPRoute для Gateway API
# Список HTTPRoute ресурсов
httpRoutes:
  # HTTPRoute для редиректа с HTTP на HTTPS
  - name: podinfo-redirect
    parentRefs:
      - name: gwin-gateway
        namespace: gwin-system
        sectionName: http
    hostnames:
      - podinfo.YOUR_DNS_ZONE
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        filters:
          - type: RequestRedirect
            requestRedirect:
              scheme: https
              statusCode: 301

  # HTTPRoute для основного HTTPS трафика
  - name: podinfo-https
    parentRefs:
      - name: gwin-gateway
        namespace: gwin-system
        sectionName: https
    hostnames:
      - podinfo.YOUR_DNS_ZONE
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        # Backend references - указываем на stable сервис
        # Во время canary развертывания Rollout автоматически управляет
        # селекторами сервисов, добавляя метку rollouts-pod-template-hash для выбора правильных подов
        # При использовании плагина Gateway API веса в backendRefs обновляются автоматически
        backendRefs:
          - name: podinfo-stable
            namespace: demo
            port: 9898
            weight: 100
