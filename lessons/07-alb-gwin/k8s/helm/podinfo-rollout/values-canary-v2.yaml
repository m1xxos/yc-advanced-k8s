# Конфигурация для чарта podinfo-rollout с Canary strategy, Canary версия
# Имя rollout и service без префикса release name
# fullnameOverride: podinfo

# Namespace задается через параметр --namespace при helm install/upgrade
# namespaceOverride не используется

# Количество реплик
replicaCount: 2

# Уровень логирования
logLevel: debug

# Настройки UI
ui:
  color: "#2ecc71"
  message: "Lesson 7: ALB Gwin with Rollout v2"

# Отключить fault injection для стабильного тестирования
faults:
  delay: false
  error: false
  unhealthy: false
  unready: false
  testFail: false
  testTimeout: false

# Лимиты и запросы ресурсов
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

# Конфигурация Service
# Для Rollout сервисы создаются Helm чартом (service-stable.yaml и service-canary.yaml)
service:
  type: NodePort

# Конфигурация Argo Rollouts с Canary strategy
rollout:
  strategy:
    canary:
      # Настройка автоматического управления трафиком через Gateway API
      # Документация: https://rollouts-plugin-trafficrouter-gatewayapi.readthedocs.io/en/latest/
      trafficRouting:
        plugins:
          # Использование плагина Gateway API для автоматического управления весами в HTTPRoute
          # Плагин должен быть установлен в контроллере Argo Rollouts
          # Документация по установке: https://rollouts-plugin-trafficrouter-gatewayapi.readthedocs.io/en/latest/installation/
          argoproj-labs/gatewayAPI:
            # Имя HTTPRoute ресурса, который будет автоматически обновляться плагином
            # Плагин будет изменять веса (weight) в backendRefs HTTPRoute в соответствии с шагами canary развертывания
            httpRoute: podinfo-https
            # Namespace, в котором находится HTTPRoute ресурс
            namespace: demo
      # Шаги развертывания canary
      steps:
        # Шаг 1: Установить вес canary на 20%
        - setWeight: 20
        # Шаг 2: Пауза для проверки (автоматическое продвижение через 120 секунд)
        - pause:
            duration: 300
        # Шаг 3: Увеличить вес canary до 40%
        - setWeight: 40
        # Шаг 4: Пауза на 30 секунд
        - pause:
            duration: 240
        # Шаг 5: Увеличить вес canary до 60%
        - setWeight: 60
        # Шаг 6: Пауза на 30 секунд
        - pause:
            duration: 240
        # Шаг 7: Увеличить вес canary до 80%
        - setWeight: 80
        # Шаг 8: Пауза на 30 секунд
        - pause:
            duration: 240
        # Шаг 9: Продвинуть canary на 100% (автоматически)
        - setWeight: 100
      # Имя сервиса для canary версии
      # Argo Rollouts автоматически управляет селектором этого сервиса
      canaryService: podinfo-canary
      # Имя сервиса для stable версии
      # Argo Rollouts автоматически управляет селектором этого сервиса
      stableService: podinfo-stable
      # Максимальное количество недоступных подов во время обновления
      maxUnavailable: 1
      # Максимальное количество дополнительных подов во время обновления
      maxSurge: 1

# Конфигурация HTTPRoute для Gateway API
# Список HTTPRoute ресурсов
httpRoutes:
  # HTTPRoute для редиректа с HTTP на HTTPS
  - name: podinfo-redirect
    parentRefs:
      - name: gwin-gateway
        namespace: gwin-system
        sectionName: http
    hostnames:
      - podinfo.YOUR_DNS_ZONE
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        filters:
          - type: RequestRedirect
            requestRedirect:
              scheme: https
              statusCode: 301

  # HTTPRoute для основного HTTPS трафика
  - name: podinfo-https
    parentRefs:
      - name: gwin-gateway
        namespace: gwin-system
        sectionName: https
    hostnames:
      - podinfo.YOUR_DNS_ZONE
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        # Backend references - указываем на stable и canary сервисы
        # Во время canary развертывания плагин Gateway API автоматически управляет
        # весами (weight) в backendRefs в соответствии с шагами canary развертывания
        # Argo Rollouts также автоматически управляет селекторами сервисов,
        # добавляя метку rollouts-pod-template-hash для выбора правильных подов
        backendRefs:
          - name: podinfo-stable
            namespace: demo
            port: 9898
          - name: podinfo-canary
            namespace: demo
            port: 9898
