apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-all-podinfo
  namespace: demo
spec:
  # Select all pods with label app.kubernetes.io/name: podinfo
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  ingress:
    - {}
  egress:
    - {}
  # Explicit deny-all ingress rule - deny all incoming traffic
  # Explicit deny-all egress rule - deny all outgoing traffic
  # This policy effectively blocks all network traffic to and from podinfo pods

