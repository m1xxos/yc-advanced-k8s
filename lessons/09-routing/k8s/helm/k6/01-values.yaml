# Set pod name
fullnameOverride: k6

# Namespace override - deploy to frontend namespace
namespaceOverride: frontend

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 300m
    memory: 128Mi

# k6 specific configuration
k6:
  # Command to run k6 test script
  command:
    - k6
    - run
    - /scripts/test.js

  configMap:
    create: true
    # Content of the k6 test script
    # Simple script to check podinfo service availability
    content: |
      import http from 'k6/http';
      import { check, sleep } from 'k6';

      export const options = {
        vus: 10,
        duration: '120m',
        noConnectionReuse: true,
        noVUConnectionReuse: true,
        // dns: {
        //   ttl: '0',
        //   select: 'random',
        //   policy: 'any',
        // },
      };

      export default function() {
        // Access podinfo service by name
        // Format: <service-name>.<namespace>.svc.cluster.local.
        // Dot at the end of fqdn to supress dns queries count
        const podinfoUrl = 'http://podinfo.demo.svc.cluster.local.:9898';
        
        let res = http.get(podinfoUrl);
        
        check(res, {
          'status is 200': (r) => r.status === 200,
          'response time < 500ms': (r) => r.timings.duration < 500,
        });
        
        sleep(0.05);
      }
    # Mount path for the script (default: /scripts)
    mountPath: /scripts
