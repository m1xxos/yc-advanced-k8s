# Количество реплик
replicaCount: 3

# Уровень логирования
logLevel: debug

# Настройки UI
ui:
  message: "Lesson 9: Session Affinity (ClientIP)"

# Отключить fault injection для стабильного тестирования
faults:
  delay: false
  error: false
  unhealthy: false
  unready: false
  testFail: false
  testTimeout: false

# Лимиты и запросы ресурсов
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

# Конфигурация Service
service:
  # Тип сервиса: ClusterIP для внутреннего трафика
  type: ClusterIP
  # Включить sessionAffinity с типом ClientIP
  sessionAffinity: ClientIP
  # Настройка таймаута привязки (по умолчанию 10800 секунд, 3 часа)
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
