# Количество реплик
replicaCount: 8

# Уровень логирования
logLevel: debug

# Настройки UI
ui:
  # color: "#34577c"
  message: "Lesson 9: Routing"

# Отключить fault injection для стабильного тестирования
faults:
  delay: false
  error: false
  unhealthy: false
  unready: false
  testFail: false
  testTimeout: false

# Лимиты и запросы ресурсов
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

# Конфигурация Topology Spread Constraints
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: podinfo

# Включаем Topology Aware Routing
service:
  type: LoadBalancer
  externalTrafficPolicy: Local
  annotations:
    service.kubernetes.io/topology-mode: Auto
